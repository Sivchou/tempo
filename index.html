<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tempo</title>
<meta name="description" content="Tempo is a paper-style school planner for assignments, SAT prep and competitions.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tempo">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f4f1e8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<section class="signin" id="signin">
  <div class="signin-in">
    <p class="date">School planner</p>
    <h1 class="large">Tempo</h1>
    <p class="lede">Assignments, due dates, SAT prep and competitions in one place. Your planner is private to your Google account and syncs across your phone and laptop.</p>
    <button class="btn go" id="signinBtn" type="button">Sign in with Google</button>
    <p class="err" id="signinErr" hidden></p>
  </div>
</section>
<div class="wrap" data-app hidden>
  <header class="top">
    <div class="toprow"><span class="date" id="topDate"></span><span class="topbtns"><button class="linkish" id="settingsBtn" type="button">Settings</button><button class="plus" id="fab" type="button" aria-label="Add something">+</button></span></div>
    <h1 class="large" id="pageTitle">Today</h1>
  </header>
  <div class="banner" id="banner" hidden></div>
  <main id="view"></main>
</div>


<nav class="tabs" aria-label="Sections" data-app hidden>
  <button data-v="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Today</button>
  <button data-v="tasks"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 6h10M10 12h10M10 18h10"/><path d="M4 6l1.5 1.5L8 5M4 12l1.5 1.5L8 11M4 18l1.5 1.5L8 17"/></svg>Tasks</button>
  <button data-v="week"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Calendar</button>
  <button data-v="goals"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2"/></svg>Goals</button>
</nav>

<div class="sheet-wrap" id="sheetWrap" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>

<div class="focus-wrap" id="focus" hidden role="dialog" aria-modal="true" aria-label="Focus timer">
  <div class="kicker kick" id="fKick">Focus</div>
  <div class="what" id="fWhat"></div>
  <div class="fring"><svg viewBox="0 0 240 240"><circle class="track" cx="120" cy="120" r="104"/><circle class="val" id="fArc" cx="120" cy="120" r="104"/></svg><div class="t" id="fTime">25:00</div></div>
  <div class="chips" id="fLens"></div>
  <div class="fbtns" id="fBtns"></div>
</div>

<div class="toast" id="toast" hidden><span id="toastMsg"></span><button id="toastBtn" type="button">Undo</button></div>

<script type="module" src="app.js"></script>
</body>
</html>
